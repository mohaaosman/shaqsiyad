name: Release

# Tag a package to publish it:
#   git tag js-v0.2.0     && git push origin js-v0.2.0      → shaqsiyad on npm
#   git tag mcp-v0.2.0    && git push origin mcp-v0.2.0     → shaqsiyad-mcp on npm
#   git tag python-v0.2.0 && git push origin python-v0.2.0  → shaqsiyad on PyPI
# npm needs an NPM_TOKEN secret. PyPI uses trusted publishing: add this repo + workflow as a publisher on pypi.org.

on:
  push:
    tags: ['js-v*', 'mcp-v*', 'python-v*']

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.ref_name, 'js-v') || startsWith(github.ref_name, 'mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: pkg
        run: echo "dir=packages/${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")" = "v${GITHUB_REF_NAME#*-v}"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile && pnpm test
        working-directory: ${{ steps.pkg.outputs.dir }}
      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tag matches pyproject version
        run: grep -q "^version = \"${GITHUB_REF_NAME#python-v}\"$" pyproject.toml
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
