[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shaqsiyad"
version = "0.2.0"
description = "Client for the Shaqsiyad API: fictional people with faces, ethnicity, faith, careers and connections."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["fake data", "test data", "fixtures", "personas", "mock users", "seed"]
dependencies = []

classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.scripts]
shaqsiyad = "shaqsiyad.__main__:main"

[project.urls]
Homepage = "https://github.com/mohaaosman/shaqsiyad"

[tool.hatch.build.targets.wheel]
packages = ["src/shaqsiyad"]
