[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shaqsiyad"
version = "0.1.0"
description = "Client for the Shaqsiyad API: fictional people with faces, ethnicity, faith, careers and connections."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["fake data", "test data", "fixtures", "personas", "mock users", "seed"]
dependencies = []

[project.urls]
Homepage = "https://github.com/mohaaosman/shaqsiyad"

[tool.hatch.build.targets.wheel]
packages = ["src/shaqsiyad"]
